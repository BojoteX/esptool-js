    <header>
        <div class=header-content>
            <div class=logo-section>
                <img src=https://raw.githubusercontent.com/BojoteX/CockpitOS/main/CockpitOS_logo_small.png alt="CockpitOS Logo" crossorigin>
                <div class=title-group>
                    <h1><span>ESP Tool</span></h1>
                    <p>Web Serial Flasher for Espressif Chips</p>
                </div>
            </div>
            <div class=header-actions>
                <div class=debug-toggle>
                    <input type=checkbox id=debugLogging value>
                    <label for=debugLogging>Debug Log</label>
                </div>
                <a class=btn-docs href=./docs/index.html>API Docs</a>
            </div>
        </div>
    </header>

    <div class=safari-warning id=safariErr>
        This tool is not supported on Safari browser. Please use Chrome or Edge.
    </div>

    <div class=container id=main>
        
        <div class=panel id=program>
            <div class=panel-header>
                <h2>Program Device</h2>
                <label id=lblConnTo class=status-badge style=display:none>Connected</label>
            </div>
            <div class=panel-body>
                <div class=form-row>
                    <div class=form-group>
                        <label for=baudrates id=lblBaudrate>Baudrate:</label>
                        <select name=baudrates id=baudrates>
                            <option value=921600>921600</option>
                            <option value=460800>460800</option>
                            <option value=230400>230400</option>
                            <option value=115200>115200</option>
                        </select>
                    </div>
                </div>

                <div class=button-group>
                    <button class="btn btn-primary" type=button id=connectButton>Connect</button>
                    <button class="btn btn-secondary" type=button id=copyTraceButton>Copy Trace</button>
                    <button class="btn btn-warning" type=button id=disconnectButton>Disconnect</button>
                    <button class="btn btn-danger" type=button id=eraseButton>Erase Flash</button>
                </div>

                <div class="alert alert-danger" id=alertDiv style=display:none>
                    <span id=alertmsg></span>
                    <button class=alert-close onclick="document.getElementById('alertDiv').style.display='none'">×</button>
                </div>

                <div id=files>
                    <div class=file-table-container>
                        <table id=fileTable>
                            <thead>
                                <tr>
                                    <th>Flash Address</th>
                                    <th>Firmware File</th>
                                    <th>Progress</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id=tableBody>
                            </tbody>
                        </table>
                    </div>

                    <button class="btn btn-secondary" type=button id=addFile>+ Add File</button>

                    <div class=flash-options>
                        <div class=flash-option>
                            <label for=flashMode id=lblFlashMode>Flash Mode</label>
                            <select name=flashMode id=flashMode>
                                <option value=keep selected>keep</option>
                                <option value=dio>dio</option>
                                <option value=qio>qio</option>
                                <option value=dout>dout</option>
                                <option value=qout>qout</option>
                            </select>
                        </div>
                        <div class=flash-option>
                            <label for=flashFreq id=lblFlashFreq>Flash Frequency</label>
                            <select name=flashFreq id=flashFreq>
                                <option value=keep>keep</option>
                            </select>
                        </div>
                        <div class=flash-option>
                            <label for=flashSize id=lblFlashSize>Flash Size</label>
                            <select name=flashSize id=flashSize>
                                <option value=detect>detect</option>
                                <option value=keep>keep</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-success" type=button id=programButton>Program Flash</button>
                </div>
            </div>
        </div>

        
        <div class=panel id=console>
            <div class=panel-header>
                <h2>Serial Console</h2>
                <label id=lblConsoleFor class=status-badge style=display:none>Monitoring</label>
            </div>
            <div class=panel-body>
                <div class=form-row>
                    <div class=form-group>
                        <label for=consoleBaudrates id=lblConsoleBaudrate>Baudrate:</label>
                        <select name=consoleBaudrates id=consoleBaudrates>
                            <option value=115200>115200</option>
                            <option value=74880>74880</option>
                        </select>
                    </div>
                    <div class=form-group>
                        <label for=reconnectDelay id=lblReconnectDelay>Reconnect Delay (ms):</label>
                        <input type=number id=reconnectDelay name=reconnectDelay value=1000 min=100 max=10000 step=100>
                    </div>
                    <div class=form-group>
                        <label for=maxRetries id=lblMaxRetries>Max Retries:</label>
                        <input type=number id=maxRetries name=maxRetries value=5 min=1 max=20 step=1>
                    </div>
                </div>

                <div class=button-group>
                    <button class="btn btn-primary" type=button id=consoleStartButton>Start Monitor</button>
                    <button class="btn btn-warning" type=button id=consoleStopButton>Stop</button>
                    <button class="btn btn-secondary" type=button id=resetButton>Reset Device</button>
                </div>
            </div>
        </div>

        
        <div id=terminal></div>
    </div>

    <footer>
        <p>Powered by <a href=https://github.com/espressif/esptool-js target=_blank>esptool-js</a> | Themed for <a href=https://github.com/BojoteX/CockpitOS target=_blank>CockpitOS</a></p>
    </footer>
